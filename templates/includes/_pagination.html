{% if page.paginator.num_pages > 1 %}<nav aria-label="Pagination" class="mt-3"><ul class="pagination pagination-sm mb-0">
  {% if page.has_previous %}<li class="page-item"><a class="page-link" href="?{% if q %}q={{ q|urlencode }}&{% endif %}page={{ page.previous_page_number }}">Previous</a></li>{% endif %}
  <li class="page-item disabled"><span class="page-link">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
  {% if page.has_next %}<li class="page-item"><a class="page-link" href="?{% if q %}q={{ q|urlencode }}&{% endif %}page={{ page.next_page_number }}">Next</a></li>{% endif %}
</ul></nav>{% endif %}
