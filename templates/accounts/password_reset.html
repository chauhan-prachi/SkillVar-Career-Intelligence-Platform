{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block content %}<div class="mx-auto" style="max-width:28rem"><h1>Reset your password</h1><p class="text-secondary">Enter your email and we will send a reset link if an account exists.</p>
<form method="post" novalidate>{% csrf_token %}{% for field in form %}{% include "includes/_field.html" %}{% endfor %}<button class="btn btn-primary w-100" type="submit">Send reset link</button></form></div>{% endblock %}
